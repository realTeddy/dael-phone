[project]
name = "tts"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tewodros Assefa", email = "assefa@tewodros.me" }
]
requires-python = ">=3.12"
dependencies = [
    "kokoro>=0.9.4",
    "numpy<2.3",
    "soundfile>=0.14.0",
    "torch>=2.14.1",
    "transformers>=4.45",
]

[project.scripts]
tts = "tts:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
